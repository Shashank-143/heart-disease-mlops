
apiVersion: apps/v1
kind: Deployment

metadata:
  name: heart-disease-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: heart-disease

  template:
    metadata:
      labels:
        app: heart-disease

    spec:
      containers:
        - name: heart-disease-container
          image: heart-disease-mlops:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8501
            - containerPort: 8000
